name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 3.11 is the floor (datetime.UTC); 3.14 is what Omarchy ships.
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
        env:
          PYTHONDONTWRITEBYTECODE: "1"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uvx ruff@0.17.2 check .
      - run: uvx --from shellcheck-py@0.11.0.1 shellcheck bin/collect tools/lint-qml
      - name: Manifest is valid JSON
        run: python3 -m json.tool manifest.json > /dev/null
